# main に反映すると、検査（型・テスト・ビルド）を通してから Cloudflare に公開する。
# 公開の仕組みと鍵は tower（kajisho5/tower）が面倒を見る。
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    uses: kajisho5/tower/.github/workflows/deploy-workers.yml@main
    with:
      build-command: npm run check
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
